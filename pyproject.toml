[project]
name = "msgr"
version = "0.1"
description = "A simple and fast messaging application"
requires-python = ">= 3.13"
authors = [
    { name = "Thiruvalluvan Kamaraj", email = "naanvallu@gmail.com" },
]
readme = "docs/README.md"
license = "Apache-2.0"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
